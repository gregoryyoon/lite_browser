<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>북마크 관리자 대시보드 - Lite Browser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="manager.css">
  <script src="theme.js"></script>
</head>
<body class="manager-body">
  <div class="dashboard-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg class="logo-icon" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
        <h2>북마크 자산</h2>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-section">
          <span class="section-title">QUICK ACCESS</span>
          <button class="nav-item active" onclick="setQuickFilter('all')">
            <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
            <span>전체 북마크</span>
            <span id="count-all" class="badge">0</span>
          </button>
          <button class="nav-item" onclick="setQuickFilter('recent')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>최근 저장됨</span>
            <span id="count-recent" class="badge">0</span>
          </button>
          <button class="nav-item" onclick="setQuickFilter('highlights')">
            <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
            <span>하이라이트 앵커</span>
            <span id="count-highlights" class="badge">0</span>
          </button>
        </div>

        <div class="menu-section">
          <span class="section-title">스마트 태그 목록</span>
          <div id="smart-tags-list" class="tags-list"></div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Control Bar -->
      <header class="top-bar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="manager-search" placeholder="제목, URL, #태그, 본문 요약, 유입 검색어로 탐색..." oninput="handleSearchInput()">
        </div>

        <div class="temporal-filter">
          <span class="filter-label">저장 시점:</span>
          <input type="range" id="temporal-slider" min="0" max="30" value="0" oninput="handleTemporalSlider()">
          <span id="temporal-value" class="slider-text">전체 기간</span>
        </div>

        <div class="layout-switcher">
          <button id="view-card-btn" class="layout-btn active" onclick="switchLayout('card')" title="카드 뷰">
            <svg viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          </button>
          <button id="view-list-btn" class="layout-btn" onclick="switchLayout('list')" title="리스트 뷰">
            <svg viewBox="0 0 24 24"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
          </button>
        </div>
      </header>

      <!-- Bento Summary Stat Widgets -->
      <section class="bento-stats-container">
        <!-- Stat 1: Total Bookmarks -->
        <div class="bento-stat-card">
          <div class="stat-icon-wrap mint">
            <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">저장된 북마크 자산</span>
            <div class="stat-value-group">
              <span id="bento-stat-total" class="stat-num">0</span>
              <span class="stat-sub">개 보관 중</span>
            </div>
          </div>
        </div>

        <!-- Stat 2: Highlights / Anchors -->
        <div class="bento-stat-card">
          <div class="stat-icon-wrap blue">
            <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">하이라이트 앵커 발췌</span>
            <div class="stat-value-group">
              <span id="bento-stat-highlights" class="stat-num">0</span>
              <span class="stat-sub">개 문맥 저장</span>
            </div>
          </div>
        </div>

        <!-- Stat 3: Top Tags Cloud Bento -->
        <div class="bento-stat-card bento-tags-cloud-card">
          <div class="stat-icon-wrap purple">
            <svg viewBox="0 0 24 24"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><circle cx="7" cy="7" r=".5" fill="currentColor"/></svg>
          </div>
          <div class="stat-content tag-cloud-content">
            <span class="stat-label">인기 스마트 태그</span>
            <div id="bento-top-tags" class="bento-tags-cloud"></div>
          </div>
        </div>
      </section>

      <!-- Bento Grid / List Main View Container -->
      <section id="manager-view-container" class="view-container">
        <div id="card-grid" class="bento-card-grid"></div>
        <div id="list-table" class="list-table hide"></div>
        <div id="empty-state" class="empty-state hide">
          <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/><line x1="14.5" x2="9.5" y1="9.5" y2="14.5"/><line x1="9.5" x2="14.5" y1="9.5" y2="14.5"/></svg>
          <p>조건에 일치하는 북마크가 없습니다.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="manager.js"></script>
</body>
</html>
