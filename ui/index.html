<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lite Browser UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser-ui">
    <div class="tabs-bar">
      <div id="tabs" class="tabs-container"></div>
      <button class="tab-btn add-tab" onclick="newTab()" title="새 탭">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <div class="tabs-spacer"></div>
      <div class="window-controls">
        <button class="win-control-btn" onclick="minimizeWindow()" title="최소화">
          <svg viewBox="0 0 10.2 1"><rect x="0" y="0" width="10.2" height="1"/></svg>
        </button>
        <button id="win-max" class="win-control-btn" onclick="maximizeWindow()" title="최대화">
          <svg viewBox="0 0 10 10"><path d="M0,0v10h10V0H0z M9,9H1V1h8V9z"/></svg>
        </button>
        <button class="win-control-btn win-close-btn" onclick="closeWindow()" title="닫기">
          <svg viewBox="0 0 10 10"><path d="M10,0.9L9.1,0L5,4.1L0.9,0L0,0.9L4.1,5L0,9.1L0.9,10L5,5.9L9.1,10L10,9.1L5.9,5L10,0.9z"/></svg>
        </button>
      </div>
    </div>
    <div class="navbar">
    <div class="nav-buttons">
      <button id="back" class="nav-btn" onclick="goBack()" disabled title="뒤로 가기">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button id="forward" class="nav-btn" onclick="goForward()" disabled title="앞으로 가기">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
      <button id="reload" class="nav-btn" onclick="reloadPage()" title="새로고침">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
    
    <div class="address-container">
      <div class="ssl-icon">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
      <input type="text" id="address-bar" placeholder="검색어 또는 웹사이트 주소 입력" onkeydown="handleKey(event)">
      <div id="loader" class="loader hide"></div>
      <button id="bookmark-star-btn" class="star-btn" onclick="triggerContextualBookmark(event)" title="이 페이지를 차세대 북마크로 자동 수집">
        <svg id="star-icon" class="star-icon" viewBox="0 0 24 24">
          <path class="star-outline" d="M12 7.13l1.82 3.69 4.07.59-2.95 2.88.7 4.05L12 16.43l-3.64 1.91.7-4.05-2.95-2.88 4.07-.59L12 7.13M12 2L9.19 7.7 2.88 8.62l4.56 4.45L6.37 19.38 12 16.4l5.63 2.98-1.07-6.31 4.56-4.45-6.31-.92L12 2z"/>
          <path class="star-filled" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      </button>

      <!-- Smart Omnibox Dropdown -->
      <div id="omnibox-dropdown" class="omnibox-dropdown hide"></div>
    </div>
    <button id="dual-split-btn" class="nav-btn" onclick="toggleDualSplit()" title="듀얼 탭 분할">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 16H5V5h6v14zm8 0h-6V5h6v14z"/></svg>
    </button>
    <button id="ai-agent-btn" class="nav-btn" onclick="toggleAiSidepanel()" title="AI 사이드패널 (Ctrl+Shift+A)">
      <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
    </button>
    <button id="bookmark-view-btn" class="nav-btn" onclick="openBookmarkDashboard()" title="북마크 관리자 대시보드 (Ctrl+Shift+O)">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
    </button>
    <button id="download-view-btn" class="nav-btn dl-toolbar-btn" onclick="openDownloadDashboard()" title="다운로드 관리자 대시보드 (Ctrl+J)">
      <div class="dl-btn-wrapper">
        <svg class="dl-btn-svg" viewBox="0 0 32 32">
          <circle class="dl-ring-bg" cx="16" cy="16" r="15"></circle>
          <circle class="dl-ring-fill" id="dl-btn-ring-fill" cx="16" cy="16" r="15"></circle>
          <g class="dl-icon-normal">
            <path d="M16 7v11.5m-4-4l4 4 4-4M8 23.5h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
          <g class="dl-icon-complete">
            <path d="M10 16.5l4 4L22.5 10" stroke="#10b981" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
        </svg>
      </div>
    </button>
    <div class="menu-container">
      <button id="menu-btn" class="nav-btn" onclick="toggleMenu(event)" title="메뉴">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </div>
  </div>

  <!-- Contextual Ingestion Toast Modal -->
  <div id="bookmark-toast-modal" class="toast-modal hide">
    <div class="toast-header">
      <div class="toast-badge">🚀 차세대 북마크 자동 수집 완료</div>
      <button class="toast-close-btn" onclick="closeToastModal()">✕</button>
    </div>
    <div class="toast-body">
      <div id="toast-thumb-box" class="toast-thumb-box"></div>
      <div class="toast-info">
        <h4 id="toast-title" class="toast-title">제목</h4>
        <p id="toast-snippet" class="toast-snippet">요약 내용</p>
        <div id="toast-intent" class="toast-intent hide"></div>
        <div id="toast-tags" class="toast-tags"></div>
      </div>
    </div>
  </div>

  <!-- Backdrop for auto-closing popups -->
  <div id="popup-backdrop" class="popup-backdrop hide" onclick="closeAllPopups()"></div>

  <!-- Bookmark Add / Edit Popup (Edge Style) -->
  <div id="bookmark-add-popup" class="bookmark-popup hide">
    <div class="popup-header">
      <span id="bm-popup-title" class="popup-title">즐겨찾기 추가됨</span>
    </div>
    <div class="popup-body">
      <div class="form-group">
        <label for="bm-name-input">이름</label>
        <input type="text" id="bm-name-input" class="popup-input" placeholder="즐겨찾기 이름">
      </div>
      <div class="form-group">
        <label for="bm-folder-select">폴더</label>
        <select id="bm-folder-select" class="popup-select"></select>
      </div>
    </div>
    <div class="popup-footer">
      <button id="bm-remove-btn" class="popup-btn btn-danger" onclick="removeCurrentBookmark()">제거</button>
      <button class="popup-btn btn-primary" onclick="saveCurrentBookmark()">완료</button>
    </div>
  </div>

  <!-- Bookmark List Popup (Edge Style) -->
  <div id="bookmark-list-popup" class="bookmark-list-panel hide">
    <div class="panel-header">
      <div class="panel-title-area">
        <svg class="panel-icon" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
        <h3>즐겨찾기</h3>
      </div>
      <div class="panel-actions">
        <button class="icon-btn" onclick="addNewFolderPrompt()" title="새 폴더 추가">
          <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3v-3h2v3h3v2z"/></svg>
        </button>
        <button class="icon-btn" onclick="closeAllPopups()" title="닫기">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-search">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="bm-search-input" placeholder="즐겨찾기 검색..." oninput="filterBookmarksList()">
    </div>
    <div id="bm-tree-container" class="panel-tree"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
