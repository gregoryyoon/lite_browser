<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다운로드 관리자</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="downloads.css">
  <script src="theme.js"></script>
</head>
<body class="downloads-body">
  <div class="dl-app-container">
    <!-- Top Header / Bar -->
    <header class="dl-header">
      <div class="dl-header-left">
        <div class="dl-header-title">
          <svg class="dl-header-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <h2>다운로드 관리자</h2>
        </div>
      </div>
      <div class="dl-header-center">
        <div class="dl-search-box">
          <svg class="dl-search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="dl-search-input" placeholder="다운로드 파일명 또는 URL 검색..." oninput="onSearchInput()">
        </div>
      </div>
      <div class="dl-header-right">
        <button class="dl-header-btn" onclick="openDownloadsFolder()" title="다운로드 폴더 열기">
          <svg viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
          <span>다운로드 폴더</span>
        </button>
        <button class="dl-header-btn btn-clear-history" onclick="clearDownloadsHistory()" title="완료된 기록 정리">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
          <span>기록 지우기</span>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs / Category Filter -->
    <nav class="dl-nav-tabs">
      <button class="dl-tab-btn active" data-filter="all" onclick="setFilter('all')">전체 (<span id="count-all">0</span>)</button>
      <button class="dl-tab-btn" data-filter="active" onclick="setFilter('active')">진행 중 (<span id="count-active">0</span>)</button>
      <button class="dl-tab-btn" data-filter="completed" onclick="setFilter('completed')">완료됨 (<span id="count-completed">0</span>)</button>
      <button class="dl-tab-btn" data-filter="missing" onclick="setFilter('missing')">파일 없음 (<span id="count-missing">0</span>)</button>
    </nav>

    <!-- Main Content Area -->
    <main class="dl-main-area">
      <!-- Active downloads summary banner -->
      <div id="dl-summary-banner" class="dl-summary-banner hide">
        <div class="summary-info">
          <div class="spinner-sm"></div>
          <span id="summary-text">다운로드 진행 중...</span>
        </div>
      </div>

      <!-- Downloads List -->
      <div id="dl-list-container" class="dl-list-container">
        <!-- Dynamic Cards Inserted Here -->
      </div>

      <!-- Empty state container -->
      <div id="dl-empty-state" class="dl-empty-state hide">
        <svg class="empty-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <h3>다운로드 기록이 없습니다</h3>
        <p>웹에서 다운로드한 파일 목록이 여기에 표시됩니다.</p>
      </div>
    </main>
  </div>

  <!-- Detail Information Modal -->
  <div id="dl-detail-modal" class="modal-backdrop hide">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📄 파일 상세 정보</h3>
        <button class="modal-close-btn" onclick="closeDetailModal()">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="detail-row">
          <span class="detail-label">파일 이름</span>
          <span id="info-file-name" class="detail-value text-bold">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">저장 경로</span>
          <span id="info-file-path" class="detail-value text-break">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">다운로드 URL</span>
          <span id="info-url" class="detail-value text-break text-blue">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">파일 크기</span>
          <span id="info-file-size" class="detail-value">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">상태 / 존재</span>
          <span id="info-status" class="detail-value">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">시작 시각</span>
          <span id="info-start-time" class="detail-value">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">MIME 타입</span>
          <span id="info-mime" class="detail-value">-</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn btn-secondary" onclick="closeDetailModal()">닫기</button>
      </div>
    </div>
  </div>

  <script src="downloads.js"></script>
</body>
</html>
